[profile.default]
src = "src"
out = "out"
libs = ["lib"]

optimizer = true
optimizer_runs = 200
evm_version = "paris"

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"
flare = "https://flare-api.flare.network/ext/C/rpc"

[etherscan]
coston2 = { key = "dummy", url = "https://coston2-explorer.flare.network/api" }
flare = { key = "dummy", url = "https://flare-explorer.flare.network/api" }
